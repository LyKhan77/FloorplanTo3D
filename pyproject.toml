[project]
name = "floorplan3d"
version = "0.1.0"
description = "Floorplan 2D to 3D pipeline (spec-centric)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy",
    "opencv-python-headless",
    "rapidocr-onnxruntime",
    "pygltflib",
    "jinja2",
    "weasyprint",
    "openai",
    "pydantic>=2.14.1",
    "shapely>=2.2.0",
    "pyyaml>=6.0.3",
    "fastapi>=0.162.0",
    "uvicorn[standard]>=0.54.0",
    "python-multipart>=0.0.32",
    "scikit-image>=0.26.0",
    "pymupdf>=2.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest",
    "pytest-cov>=7.1.0",
    "ruff",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "blender: needs Blender",
    "slow: takes more than 10 seconds",
    "strata: needs Strata running",
]

[tool.ruff]
line-length = 100
extend-exclude = ["web"]
